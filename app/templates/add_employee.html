{% extends "base.html" %}

{% block title %}
Add Employee
{% endblock %}


{% block content %}

<h1>
    Add Employee
</h1>


<form
    method="POST"
    class="employee-form"
>

    <label>
        Name
    </label>

    <input
        type="text"
        name="name"
        required
    >


    <label>
        Email
    </label>

    <input
        type="email"
        name="email"
        required
    >


    <label>
        Department
    </label>

    <input
        type="text"
        name="department"
        required
    >


    <label>
        Position
    </label>

    <input
        type="text"
        name="position"
        required
    >


    <label>
        Salary
    </label>

    <input
        type="number"
        name="salary"
        min="0"
        step="0.01"
        required
    >


    <button type="submit">
        Add Employee
    </button>

</form>

{% endblock %}
