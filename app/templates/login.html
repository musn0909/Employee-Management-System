{% extends "base.html" %}

{% block title %}
Login - Employee Management
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>Employee Management</h1>

        <p class="login-subtitle">
            Sign in to continue
        </p>

        <div id="login-error" class="alert error" style="display: none;"></div>

        <form id="login-form">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
